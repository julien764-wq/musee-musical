x<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musée Musical — Archives Annuelles</title>
<style>
:root{--bg:#101010;--panel:#181818;--panel2:#202020;--text:#f4f0e8;--muted:#aaa7a0;--accent:#d6a36a;--line:#33302b;--green:#1ed760}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:215px 1fr}
aside{border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:18px;letter-spacing:.04em;font-weight:750;line-height:1.2}.subbrand{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:5px}
nav{display:grid;gap:6px}
nav a{color:#c6c2bb;text-decoration:none;padding:10px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer}
nav a.active,nav a:hover{background:#29241e;color:var(--accent)}
.year-selector{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.year-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.year-btn.active,.year-btn:hover{background:var(--accent);color:#101010;border-color:var(--accent)}
.quote{color:#b4aaa0;font-family:Georgia,serif;font-style:italic;line-height:1.55;font-size:13px;margin-top:auto}
main{padding:32px clamp(22px,4vw,58px) 28px;min-width:0;max-width:1600px;width:100%;margin:auto}
.hero{position:relative;overflow:hidden;padding:10px 0 28px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #493a2c;border-radius:50%;right:3%;top:-175px;box-shadow:0 0 0 12px #17130f,0 0 0 13px #33271d,0 0 0 30px #13110f,0 0 0 31px #28221c;opacity:.7;pointer-events:none}
h1{font-size:clamp(54px,7vw,86px);line-height:.95;letter-spacing:-.06em;margin:10px 0 5px;position:relative;z-index:1}
.hero h2{font-weight:400;font-size:28px;color:#d0c8bf;margin:0 0 12px}
.intro{color:var(--muted);font-size:14px;line-height:1.6;max-width:520px}
.search-bar{margin:20px 0 10px;display:flex;gap:10px;max-width:400px}
.search-bar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.section-head{display:flex;align-items:baseline;gap:18px;margin:25px 0 18px}
.section-head h3{margin:0;font-size:19px;white-space:nowrap}
.rule{height:1px;background:var(--line);flex:1}.count{color:var(--muted);font-size:12px}
.featured{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px 22px}
.track-card{min-width:0;display:flex;flex-direction:column}
.cover{aspect-ratio:1/1;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;box-shadow:0 5px 18px #0007;background-size:cover;background-position:center}
.cover.fallback{background:radial-gradient(circle at 30% 25%,#2a221b,#181410)}
.cover.fallback:before{content:"";position:absolute;inset:8%;border:1px solid #ffffff1a;border-radius:50%}
.cover.fallback:after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#111b;box-shadow:0 0 0 7px #ffffff0a}
.cover .arttext{position:relative;z-index:1;font-weight:800;letter-spacing:.07em;text-transform:uppercase;font-size:clamp(12px,1.4vw,18px);line-height:1.15;color:var(--text);text-shadow:0 2px 8px #000;max-width:90%;overflow-wrap:anywhere}
.track-meta{display:flex;gap:9px;align-items:flex-start;margin-top:12px}
.rank{color:var(--accent);font-weight:700;font-size:13px;min-width:22px}
.track-name{font-size:14px;font-weight:650;line-height:1.35}
.artist{font-size:12px;color:var(--muted);margin-top:3px}
.listen{display:inline-flex;align-items:center;gap:7px;color:#c8c6c0;text-decoration:none;font-size:11px;margin:10px 0 0 31px;font-weight:600}
.listen:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.listen:hover{color:var(--green)}
.compact{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.list-track{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid #242424;padding:10px 0;min-width:0}
.list-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-artist{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-track .listen{margin:0;font-size:11px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;display:flex;justify-content:space-between;color:#777;font-size:11px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}.featured{grid-template-columns:repeat(2,minmax(0,1fr))}.compact{grid-template-columns:1fr}}
</style>
</head>

let currentYear = "2025";
const extensions = ['.jpeg', '.jpg', '.png', '.webp', '.JPEG', '.JPG', '.PNG'];

function getSpotifyUri(title, artist) {
  return "spotify:search:" + encodeURIComponent(title + " " + artist);
}

function tryLoadImage(container, year, rank, trackTitle) {
  let extIndex = 0;
  function attempt() {
    if (extIndex >= extensions.length) {
      container.classList.add('fallback');
      const span = document.createElement('span');
      span.className = 'arttext';
      span.textContent = trackTitle;
      container.appendChild(span);
      return;
    }
    const ext = extensions[extIndex];
    const imgPath = `${year}-${rank}${ext}`;
    const img = new Image();
    img.onload = function() { container.style.backgroundImage = `url('${imgPath}')`; };
    img.onerror = function() { extIndex++; attempt(); };
    img.src = imgPath;
  }
  attempt();
}

function renderYear(year) {
  currentYear = year;
  document.getElementById('nav-home').classList.add('active');
  document.getElementById('nav-artists').classList.remove('active');
  document.getElementById('years-block').style.display = 'block';

  document.getElementById('hero-title').textContent = year;
  document.getElementById('hero-subtitle').textContent = "Top " + (archives[year] ? archives[year].length : 0);
  document.getElementById('hero-intro').textContent = `Archives musicales de l'année ${year}.`;
  document.getElementById('footer-info').textContent = `${year} · Top ` + (archives[year] ? archives[year].length : 0);

  document.querySelectorAll('.year-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.year === year);
  });

  const tracks = archives[year] || [];
  const content = document.getElementById('content-area');
  content.innerHTML = '';

  const head1 = document.createElement('div');
  head1.className = 'section-head';
  head1.innerHTML = '<h3>Mes 8 morceaux préférés</h3><div class="rule"></div><div class="count">1 — 8</div>';
 
  const featGrid = document.createElement('section');
  featGrid.className = 'featured';

  tracks.slice(0, 8).forEach((t, i) => {
    const rank = i + 1;
    const card = document.createElement('article');
    card.className = 'track-card';

    const cover = document.createElement('div');
    cover.className = 'cover';
    tryLoadImage(cover, year, rank, t[0]);

    const meta = document.createElement('div');
    meta.className = 'track-meta';
    meta.innerHTML = `<div class="rank">${rank}.</div><div><div class="track-name">${t[0]}</div><div class="artist">${t[1]}</div></div>`;

    const link = document.createElement('a');
    link.className = 'listen';
    link.href = getSpotifyUri(t[0], t[1]);
    link.textContent = 'Écouter sur Spotify';

    card.append(cover, meta, link);
    featGrid.appendChild(card);
  });

  const head2 = document.createElement('div');
  head2.className = 'section-head';
  head2.innerHTML = '<h3>Le classement complet</h3><div class="rule"></div><div class="count">9 — ' + tracks.length + '</div>';

  const compactGrid = document.createElement('section');
  compactGrid.className = 'compact';

  tracks.slice(8).forEach((t, j) => {
    const rank = j + 9;
    const row = document.createElement('div');
    row.className = 'list-track';
    row.innerHTML = `
      <div class="rank">${rank}.</div>
      <div style="min-width:0">
        <div class="list-title">${t[0]}</div>
        <div class="list-artist">${t[1]}</div>
      </div>
      <a class="listen" href="${getSpotifyUri(t[0], t[1])}">Écouter</a>
    `;
    compactGrid.appendChild(row);
  });

  content.append(head1, featGrid, head2, compactGrid);
}

function renderArtists() {
  document.getElementById('nav-home').classList.remove('active');
  document.getElementById('nav-artists').classList.add('active');
  document.getElementById('years-block').style.display = 'none';

  document.getElementById('hero-title').textContent = "Artistes";
  document.getElementById('hero-subtitle').textContent = "Index complet";
  document.getElementById('hero-intro').textContent = "Tous les artistes présents dans vos archives musicales (2009-2025).";
  document.getElementById('footer-info').textContent = "Tous les artistes";

  const artistMap = {};
  Object.entries(archives).forEach(([year, tracks]) => {
    tracks.forEach((t, i) => {
      const artistName = t[1];
      if (!artistMap[artistName]) artistMap[artistName] = [];
      artistMap[artistName].push({ title: t[0], year: year, rank: i + 1 });
    });
  });

  const sortedArtists = Object.keys(artistMap).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

  const content = document.getElementById('content-area');
  content.innerHTML = '';

  const compactGrid = document.createElement('section');
  compactGrid.className = 'compact';

  sortedArtists.forEach(artist => {
    artistMap[artist].forEach(item => {
      const row = document.createElement('div');
      row.className = 'list-track';
      row.innerHTML = `
        <div class="rank" style="min-width:42px;color:var(--accent);font-size:11px">${item.year}</div>
        <div style="min-width:0">
          <div class="list-title">${artist}</div>
          <div class="list-artist">#${item.rank} — ${item.title}</div>
        </div>
        <a class="listen" href="${getSpotifyUri(item.title, artist)}">Écouter</a>
      `;
      compactGrid.appendChild(row);
    });
  });

  content.appendChild(compactGrid);
}

function initYearButtons() {
  const container = document.getElementById('year-btns');
  container.innerHTML = '';
  Object.keys(archives).sort().reverse().forEach(y => {
    const btn = document.createElement('button');
    btn.className = `year-btn ${y === currentYear ? 'active' : ''}`;
    btn.dataset.year = y;
    btn.textContent = y;
    btn.onclick = () => renderYear(y);
    container.appendChild(btn);
  });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (!query) {
    if (document.getElementById('nav-artists').classList.contains('active')) {
      renderArtists();
    } else {
      renderYear(currentYear);
    }
    return;
  }

  const content = document.getElementById('content-area');
  content.innerHTML = '<div class="section-head"><h3>Résultats de recherche</h3><div class="rule"></div></div>';
 
  const compactGrid = document.createElement('section');
  compactGrid.className = 'compact';

   Object.entries(archives).forEach(([year, tracks]) => {
    tracks.forEach((t, i) => {
      // Sécurisation : vérifie que le morceau possède bien un titre et un artiste sous forme de tableau
      if (Array.isArray(t) && t[0] && t[1]) {
        const titleLower = t[0].toLowerCase();
        const artistLower = t[1].toLowerCase();
        const searchLower = query.toLowerCase().trim();

        if (titleLower.includes(searchLower) || artistLower.includes(searchLower)) {
          const row = document.createElement('div');
          row.className = 'list-track';
          row.innerHTML = `
            <div class="rank" style="min-width:40px;color:var(--muted)">${year}</div>
            <div style="min-width:0">
              <div class="list-title">#${i + 1} — ${t[0]}</div>
              <div class="list-artist">${t[1]}</div>
            </div>
            <a class="listen" href="${getSpotifyUri(t[0], t[1])}">Écouter</a>
          `;
          compactGrid.appendChild(row);
        }
      }
    });
  });

  content.appendChild(compactGrid);
});

document.getElementById('nav-home').onclick = () => renderYear('2025');
document.getElementById('nav-artists').onclick = () => renderArtists();

initYearButtons();
renderYear('2025');
</script>
